<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>回响 · 泰拉</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
:root{
  /* 冷色记忆基调 —— 深蓝黑到暗青,白光为唯一亮部 */
  --bg-0:#070f18;      /* 最深背景 */
  --bg-1:#0a1420;      /* 场景底 */
  --ink:#dfe8f2;       /* 正文 */
  --ink-dim:#8296ac;   /* 次要文字 */
  --line:#1e3049;      /* 分隔/边框 */
  --glow:#eaf4ff;      /* 白光剪影 */
  --warm:#e8c98f;      /* 结局暖金,一次性介入 */
  --warm-deep:#c99a54;
  --panel:rgba(8,16,26,.82);
  --choice:rgba(18,32,50,.72);
  --choice-hi:rgba(34,58,88,.9);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg-0);
  color:var(--ink);
  font-family:"Noto Serif SC",Georgia,"Songti SC",serif;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ---- 舞台 ---- */
#stage{position:fixed;inset:0;display:flex;flex-direction:column;z-index:1;
  transition:background 1.2s ease;}
#scene{position:absolute;inset:0;overflow:hidden}

/* 场景氛围:漂浮的源石尘埃 */
.dust{position:absolute;width:2px;height:2px;border-radius:50%;
  background:var(--glow);opacity:0;pointer-events:none;
  animation:drift linear infinite}
@keyframes drift{
  0%{transform:translateY(105vh);opacity:0}
  10%{opacity:.5}
  90%{opacity:.5}
  100%{transform:translateY(-5vh);opacity:0}
}

/* ---- 白光剪影舞台(三阶段) ---- */
#silhouette{
  position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);
  width:min(52vh,400px);height:min(80vh,600px);
  pointer-events:none;
  transition:opacity 1.4s ease;
}
#silhouette.hidden{opacity:0}

/* 光晕(全阶段共用,阶段3减弱) */
#silhouette .halo{
  position:absolute;left:50%;top:50%;
  width:150%;height:150%;transform:translate(-50%,-50%);
  background:radial-gradient(ellipse at center,
    rgba(234,244,255,.28),rgba(234,244,255,.06) 45%,transparent 66%);
  filter:blur(10px);transition:opacity 1.2s;
}

/* 阶段1:一团很虚的模糊白光(柔光打底 + 湍流叠加) */
#silhouette .blob{
  position:absolute;left:50%;top:50%;
  width:70%;height:60%;transform:translate(-50%,-50%);
  background:radial-gradient(ellipse at 48% 42%,
    rgba(255,255,255,.85), rgba(234,244,255,.5) 34%,
    rgba(200,224,255,.22) 60%, transparent 78%);
  border-radius:48% 52% 55% 45% / 58% 48% 52% 42%;
  filter:url(#bubble) blur(22px);
  opacity:0;transition:opacity 1.4s;
  animation:blobPulse 11s ease-in-out infinite;
}
/* 叠一层更大更虚的外光晕,强化"虚幻白光"感 */
#silhouette .blob::after{
  content:"";position:absolute;left:50%;top:50%;
  width:150%;height:150%;transform:translate(-50%,-50%);
  background:radial-gradient(ellipse at center,
    rgba(234,244,255,.4),transparent 60%);
  filter:blur(30px);
}
@keyframes blobPulse{
  0%,100%{transform:translate(-50%,-50%) scale(1)   rotate(0deg)}
  33%    {transform:translate(-50%,-52%) scale(1.1)  rotate(3deg)}
  66%    {transform:translate(-50%,-49%) scale(.92) rotate(-3deg)}
}

/* 阶段2:很虚的模糊人影(白光人形,非实心) */
#silhouette .figure{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  filter:url(#bubble) blur(14px);
  opacity:0;transition:opacity 1.4s;
}
#silhouette .figure svg{width:100%;height:100%;
  filter:drop-shadow(0 0 24px rgba(234,244,255,.7));}
#silhouette .figure .form{fill:rgba(255,255,255,.72)}

/* 阶段3:放大的白色立绘剪影(用 mask 从透明底立绘取形,填白) */
#silhouette .portraits{
  position:fixed;left:50%;bottom:-16vh;top:auto;
  transform:translateX(-50%);
  width:min(100vh,760px);height:105vh;
  opacity:0;transition:opacity 1.2s;
  z-index:5;
}
#silhouette .portrait{
  position:absolute;inset:0;
  background-repeat:no-repeat;background-position:bottom center;
  background-size:contain;
  opacity:0;
  filter:url(#ripple) blur(9px) drop-shadow(0 0 26px rgba(234,244,255,.5));
  transition:opacity 1.1s ease;
}
#silhouette .portrait.active{opacity:.88}

/* ---- 剧情框 ---- */
#textbox{
  position:relative;margin-top:auto;
  background:linear-gradient(180deg,transparent,var(--panel) 22%);
  padding:clamp(28px,6vh,68px) clamp(20px,7vw,120px) clamp(30px,5vh,54px);
  min-height:34vh;display:flex;flex-direction:column;justify-content:flex-end;
}
#speaker{color:var(--warm);font-size:.86rem;letter-spacing:.28em;
  margin-bottom:.7em;min-height:1.1em;font-family:"Noto Sans SC",sans-serif;}
#dialogue{font-size:clamp(1.02rem,2.2vw,1.34rem);line-height:2;
  max-width:52em;min-height:3.6em;}
#dialogue .cursor{display:inline-block;width:.5em;color:var(--warm);
  animation:blink 1s step-start infinite}
@keyframes blink{50%{opacity:0}}

/* 继续提示 */
#continue-hint{margin-top:1.2em;color:var(--ink-dim);font-size:.82rem;
  letter-spacing:.2em;opacity:0;transition:opacity .4s;
  font-family:"Noto Sans SC",sans-serif;}
#continue-hint.show{opacity:.7}

/* ---- 选项卡 ---- */
#choices{position:absolute;left:0;right:0;bottom:calc(34vh + 12px);
  display:flex;flex-direction:column;gap:12px;align-items:center;
  padding:0 clamp(20px,7vw,120px);pointer-events:none;}
.choice{
  pointer-events:auto;width:min(52em,100%);
  background:var(--choice);border:1px solid var(--line);
  color:var(--ink);text-align:left;
  padding:16px 22px;font-size:clamp(.94rem,1.9vw,1.08rem);
  font-family:"Noto Sans SC",sans-serif;line-height:1.6;
  cursor:pointer;border-radius:2px;
  transform:translateY(8px);opacity:0;
  transition:background .25s,border-color .25s,transform .4s,opacity .4s;
  backdrop-filter:blur(3px);
}
.choice:hover,.choice:focus-visible{
  background:var(--choice-hi);border-color:#3c6294;outline:none;
  transform:translateY(0) translateX(4px);
}
.choice.in{transform:translateY(0);opacity:1}

/* ---- 结局显影(眼睑开合→睁眼白光绽开→彩色立绘→移左) ---- */
#ending{position:fixed;inset:0;background:var(--bg-0);
  display:none;z-index:40;opacity:0;transition:opacity .8s ease;}
#ending.show{display:block;opacity:1}

/* 显影舞台 */
.reveal-stage{position:absolute;top:50%;left:50%;
  width:min(150vh,1100px);height:min(150vh,1100px);
  transform:translate(-50%,-50%);
  transition:left 1.4s cubic-bezier(.5,0,.2,1),
             width 1.4s cubic-bezier(.5,0,.2,1),
             height 1.4s cubic-bezier(.5,0,.2,1);}
#ending.shifted .reveal-stage{left:30%;
  width:min(88vh,680px);height:min(120vh,920px);}
@media(max-width:760px){
  /* 手机结算:立绘缩小上移到上半屏,下半屏留给文字和按钮 */
  .reveal-stage{width:104vw!important;height:104vw!important;
    top:34%!important;left:50%!important;}
  #ending.shifted .reveal-stage{width:88vw!important;height:88vw!important;
    top:26%!important;left:50%!important;}
}

/* 朦胧发光白剪影:眨眼时露头,缩小(不要太大) */
.rv-sil{position:absolute;inset:0;width:100%;height:100%;
  object-fit:contain;object-position:center 40%;
  opacity:0;transform:scale(1.15);
  filter:blur(9px) brightness(1.5) drop-shadow(0 0 40px rgba(234,244,255,.65));}
#ending.blink .rv-sil{opacity:.9;}
#ending.bloomed .rv-sil{opacity:0 !important;animation:none !important;
  transition:opacity .5s ease;}

/* 眼睛形状蒙版(SVG):杏仁眼孔开合 */
.eye-mask{position:absolute;inset:0;width:100%;height:100%;z-index:6;
  pointer-events:none;opacity:1;transition:opacity .7s ease;}
.eye-shape{transform-box:fill-box;transform-origin:center;transform:scaleY(.04);}
#ending.blink .eye-shape{animation:eyeBlink 2.8s ease forwards;}
@keyframes eyeBlink{
  0%{transform:scaleY(.04);}    /* 几乎闭合 */
  12%{transform:scaleY(.72);}   /* 睁开 */
  22%{transform:scaleY(.2);}    /* 眨1 */
  33%{transform:scaleY(.8);}    /* 睁开 */
  43%{transform:scaleY(.16);}   /* 眨2 */
  58%{transform:scaleY(.5);}    /* 开始最终睁开 */
  100%{transform:scaleY(2.6);}  /* 缓缓睁到最大(后段放慢) */
}
/* 睁大后眼罩平滑淡出(不硬切、不跳变) */
#ending.bloomed .eye-mask{opacity:0;}

/* 白光绽开:中心亮核 + 水波涟漪环,停留更久 */
.rv-bloom{position:absolute;left:50%;top:42%;width:10%;height:10%;
  transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,#fff,rgba(234,244,255,.9) 28%,transparent 68%);
  opacity:0;pointer-events:none;z-index:5;
  filter:url(#ripple);}
#ending.bloomed .rv-bloom{animation:bloom 2s cubic-bezier(.2,.6,.25,1) forwards;}
@keyframes bloom{
  0%{opacity:0;width:6%;height:6%;}
  18%{opacity:1;}
  50%{opacity:1;width:120%;height:120%;}   /* 中段保持最亮,停留久 */
  70%{opacity:.85;}
  100%{opacity:0;width:260%;height:260%;}
}
/* 水波涟漪环:向外扩散的光环 */
.rv-bloom::before,.rv-bloom::after{content:"";position:absolute;
  left:50%;top:50%;width:100%;height:100%;
  transform:translate(-50%,-50%);border-radius:50%;
  border:2px solid rgba(234,244,255,.6);opacity:0;}
#ending.bloomed .rv-bloom::before{animation:rippleRing 2s ease-out .1s forwards;}
#ending.bloomed .rv-bloom::after{animation:rippleRing 2s ease-out .5s forwards;}
@keyframes rippleRing{
  0%{opacity:.7;width:20%;height:20%;border-width:3px;}
  100%{opacity:0;width:320%;height:320%;border-width:0;}
}

/* 彩色立绘:绽开后浮现 */
.rv-real{position:absolute;inset:0;width:100%;height:100%;
  object-fit:contain;object-position:center;
  opacity:0;transform:scale(1.1);}
#ending.bloomed .rv-real{opacity:1;transform:scale(1);
  transition:opacity 1.3s ease .85s,transform 1.5s cubic-bezier(.3,.7,.3,1) .85s;}

/* ===== 全局蓝色炫光背景层(纯 CSS,替代 Blue_Gleam 视频) ===== */
/* 垫在所有内容之下(z0),全程循环:蓝色柔光呼吸 + 斜向光束扫动 + 光晕脉动 */
#global-flare{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 40%,#0a1626 0%,#070f18 70%);}
#global-flare > *{position:absolute;mix-blend-mode:screen;will-change:transform,opacity;}
/* 几团蓝色柔光,缓慢呼吸漂移 */
.gf-haze{inset:-20%;
  background:
    radial-gradient(38% 32% at 26% 30%,rgba(74,140,220,.34),transparent 70%),
    radial-gradient(42% 36% at 74% 66%,rgba(60,120,200,.30),transparent 72%),
    radial-gradient(30% 40% at 52% 82%,rgba(96,160,235,.22),transparent 70%);
  filter:blur(40px);animation:gfBreathe 16s ease-in-out infinite;}
@keyframes gfBreathe{
  0%,100%{transform:translate3d(0,0,0) scale(1);opacity:.7;}
  50%{transform:translate3d(2%,-2%,0) scale(1.08);opacity:1;}
}
/* 斜向光束,极慢横扫 */
.gf-beam{top:-30%;width:44%;height:160%;filter:blur(46px);opacity:0;
  background:linear-gradient(180deg,transparent,
    rgba(120,180,255,.18) 30%,rgba(160,205,255,.42) 50%,rgba(120,180,255,.18) 70%,transparent);
  transform:rotate(14deg);}
.gf-beam-a{left:-30%;animation:gfSweepA 19s ease-in-out infinite;}
.gf-beam-b{left:-10%;animation:gfSweepB 27s ease-in-out infinite;animation-delay:-9s;}
@keyframes gfSweepA{
  0%{transform:translateX(-20%) rotate(14deg);opacity:0;}
  25%,60%{opacity:.9;}
  100%{transform:translateX(220%) rotate(14deg);opacity:0;}
}
@keyframes gfSweepB{
  0%{transform:translateX(-10%) rotate(-11deg);opacity:0;}
  30%,65%{opacity:.7;}
  100%{transform:translateX(180%) rotate(-11deg);opacity:0;}
}
/* 蓝色光晕,明暗脉动 */
.gf-orb{border-radius:50%;filter:blur(50px);
  background:radial-gradient(circle at 50% 50%,rgba(150,200,255,.5),rgba(80,140,220,.22) 45%,transparent 70%);}
.gf-orb-a{top:-12%;left:-8%;width:42vw;height:42vw;animation:gfPulse 13s ease-in-out infinite;}
.gf-orb-b{bottom:-16%;right:-10%;width:52vw;height:52vw;animation:gfPulse 17s ease-in-out infinite;animation-delay:-6s;}
@keyframes gfPulse{
  0%,100%{opacity:.28;transform:scale(1);}
  50%{opacity:.6;transform:scale(1.12);}
}
@media(max-width:760px){
  /* 手机端:降 blur、去一条光束,省性能 */
  .gf-haze{filter:blur(28px);}
  .gf-beam-b{display:none;}
  .gf-orb{filter:blur(34px);}
}
/* 镜头炫光:柔光晕染垫底 + 横向长方形光带扫过 + 左上角圆形光晕,screen 叠最上层 */
.fx-flare{position:fixed;inset:0;z-index:20;pointer-events:none;
  mix-blend-mode:screen;opacity:0;transition:opacity 1.4s ease;overflow:hidden;}
#ending.bloomed .fx-flare{opacity:1;}
/* 几团很虚的柔光晕染,JS 生成 6 团 */
.fx-flare .haze{position:absolute;border-radius:50%;filter:blur(60px);
  background:radial-gradient(circle at 42% 40%,
    rgba(224,238,255,.55),rgba(180,210,255,.22) 55%,transparent 78%);
  animation:hazeDrift ease-in-out infinite;}
@keyframes hazeDrift{
  0%,100%{transform:translate(0,0) scale(1);opacity:.35;}
  50%{transform:translate(var(--hx),var(--hy)) scale(1.12);opacity:.7;}
}
/* 横向长方形光带:画面中部横扫一次 */
.fx-flare-rect{position:absolute;top:46%;left:0;width:60%;height:20%;
  transform:translateX(-120%) skewX(-8deg);
  background:linear-gradient(90deg,transparent,
    rgba(210,232,255,.16) 30%,rgba(255,255,255,.55) 50%,rgba(210,232,255,.16) 70%,transparent);
  filter:blur(14px);opacity:0;}
#ending.shifted .fx-flare-rect{animation:sweepRect 2.8s cubic-bezier(.25,.5,.3,1) .1s;}
@keyframes sweepRect{
  0%{transform:translateX(-120%) skewX(-8deg);opacity:0;}
  18%{opacity:1;}
  82%{opacity:1;}
  100%{transform:translateX(240%) skewX(-8deg);opacity:0;}
}
/* 左上角圆形光晕:亮起一次 */
.fx-flare-round{position:absolute;top:-8%;left:-6%;width:38vw;height:38vw;
  border-radius:50%;filter:blur(30px);opacity:0;
  background:radial-gradient(circle at 50% 50%,
    rgba(255,255,255,.7),rgba(210,232,255,.32) 45%,transparent 70%);}
#ending.shifted .fx-flare-round{animation:sweepRound 3s ease-in-out .2s;}
@keyframes sweepRound{
  0%{opacity:0;transform:scale(.7);}
  30%{opacity:.9;transform:scale(1);}
  60%{opacity:.5;transform:scale(1.08);}
  100%{opacity:0;transform:scale(1.15);}
}



/* 半透明信息浮层:拉宽 */
.end-info{position:absolute;top:52%;right:5%;left:auto;z-index:3;
  transform:translateY(-50%) translateX(24px);
  width:min(52vw,600px);max-height:92vh;overflow-y:auto;
  padding:clamp(20px,2.6vw,38px);
  background:linear-gradient(120deg,rgba(7,15,24,.66),rgba(7,15,24,.34));
  backdrop-filter:blur(3px);border-radius:3px;
  opacity:0;transition:opacity 1s ease,transform 1s ease;}
#ending.shifted .end-info{opacity:1;transform:translateY(-50%) translateX(0);}
@media(max-width:760px){
  .end-info{top:auto;bottom:2.5vh;right:4%;left:4%;width:auto;max-height:none;
    padding:0 4vw;background:none;backdrop-filter:none;
    transform:translateX(0);text-align:center;}
  #ending.shifted .end-info{transform:translateX(0)}
  /* 手机端压紧字号行距,保证按钮进屏 */
  .end-info .op-eyebrow{margin-bottom:.5em;font-size:.78rem;}
  .end-info .op-name{font-size:clamp(2.4rem,10vw,3.2rem);}
  .end-info .op-goldline{margin:16px auto 16px;}
  .end-info .op-ending{font-size:.94rem;line-height:1.75;}
  .end-info .op-ending p{margin-bottom:.6em;}
  .end-info .end-actions{margin-top:1.4em;}
}



.op-eyebrow{color:var(--warm);letter-spacing:.42em;font-size:.86rem;
  font-family:"Noto Sans SC",sans-serif;margin-bottom:1em;}
.op-name{font-size:clamp(3rem,7vw,5rem);letter-spacing:.16em;
  color:var(--glow);line-height:1.1;
  text-shadow:0 0 44px rgba(234,244,255,.42);}
.op-goldline{width:72px;height:1px;margin:30px 0 32px;
  background:linear-gradient(90deg,var(--warm),transparent);}
.op-ending{font-size:clamp(1.04rem,2vw,1.24rem);line-height:2.15;color:var(--ink);}
.op-ending p{margin-bottom:1.1em;opacity:0;transform:translateY(8px);
  animation:lineIn .9s ease forwards;}
@keyframes lineIn{to{opacity:1;transform:translateY(0)}}
.end-actions{margin-top:2.8em;display:flex;gap:14px;flex-wrap:wrap;}
#reunion,#replay{background:none;padding:14px 30px;letter-spacing:.2em;
  font-family:"Noto Sans SC",sans-serif;cursor:pointer;border-radius:2px;
  font-size:.86rem;transition:all .3s;}
#reunion{border:1px solid var(--warm-deep);color:var(--warm);}
#reunion:hover{background:rgba(232,201,143,.1);box-shadow:0 0 26px rgba(232,201,143,.14)}
#replay{border:1px solid var(--line);color:var(--ink-dim);}
#replay:hover{border-color:var(--ink-dim);color:var(--ink)}
@media(max-width:760px){.end-actions{justify-content:center}
  .op-goldline{margin-left:auto;margin-right:auto}}
#reunion-scene{position:fixed;inset:0;z-index:50;display:none;
  background:var(--bg-0);}
#reunion-scene.show{display:block}
#reunion-scene .rs-bg{position:absolute;left:50%;top:0;
  transform:translateX(-50%);
  width:min(70vh,540px);height:82vh;
  background-repeat:no-repeat;background-size:contain;background-position:center top;
  opacity:1;filter:none;}
#reunion-scene .rs-bg::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 55%,var(--bg-0));}
.rs-textbox{position:absolute;left:0;right:0;bottom:0;
  background:linear-gradient(180deg,transparent,var(--panel) 24%);
  padding:clamp(28px,6vh,68px) clamp(20px,7vw,120px) clamp(30px,5vh,54px);
  min-height:36vh;display:flex;flex-direction:column;justify-content:flex-end;}
.rs-speaker{color:var(--warm);font-size:.86rem;letter-spacing:.28em;
  margin-bottom:.7em;min-height:1.1em;font-family:"Noto Sans SC",sans-serif;}
.rs-dialogue{font-size:clamp(1.02rem,2.2vw,1.34rem);line-height:2;max-width:52em;
  min-height:3.6em;}
.rs-hint{margin-top:1.2em;color:var(--ink-dim);font-size:.82rem;letter-spacing:.2em;
  opacity:0;transition:opacity .4s;font-family:"Noto Sans SC",sans-serif;}
.rs-hint.show{opacity:.7}

@media(max-width:760px){
  /* 结算页锁死不可滚动/不可拖,内容用绝对定位铺满一屏 */
  #ending{overflow:hidden;}
}

/* ---- 普瑞塞斯 meta 前置层(在所有 UI 之前) ---- */
#meta{position:fixed;inset:0;z-index:90;display:none;
  background:#02060b;color:#c9f0ff;
  align-items:center;justify-content:center;flex-direction:column;
  font-family:"Noto Sans SC",monospace,sans-serif;}
#meta.show{display:flex}
#meta::before{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,
    rgba(120,220,255,.03) 0px,rgba(120,220,255,.03) 1px,
    transparent 1px,transparent 3px);pointer-events:none;}
.meta-inner{max-width:640px;padding:40px;position:relative;z-index:2}
.meta-tag{color:#4fd4ff;letter-spacing:.4em;font-size:.74rem;
  margin-bottom:2.4em;opacity:.7}
#meta-lines p{font-size:clamp(1.02rem,2.2vw,1.28rem);line-height:2.1;
  margin-bottom:1.2em;opacity:0;transform:translateX(-6px);}
#meta-lines p.in{opacity:1;transform:translateX(0);
  transition:opacity .8s,transform .8s;}
.meta-name{color:#eaf4ff;font-size:2rem;letter-spacing:.3em;
  margin:1.4em 0;text-shadow:0 0 30px rgba(120,220,255,.5);}

/* ---- 开场标题 ---- */
#title-screen{position:fixed;inset:0;z-index:60;background:#000;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  transition:opacity 1s;overflow:hidden;}
/* 封面背景层 */
#title-screen .tt-cover{position:absolute;inset:-4%;
  background:url("assets/cover/cover.png") center/cover no-repeat;
  filter:url(#waterSurface) blur(1px);}
#title-screen::before{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.55));}
/* 黑色底布:整体压暗回灰(静态,更暗) */
.tt-breathe{position:absolute;inset:0;pointer-events:none;
  background:rgba(0,0,0,.56);}
/* 一圈圈荡开的水波涟漪 */
.tt-ripples{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.tt-ripples .ripple{position:absolute;border-radius:50%;
  border:2.5px solid rgba(220,238,255,.85);
  box-shadow:0 0 12px rgba(200,230,255,.4);
  transform:translate(-50%,-50%) scale(0);opacity:0;
  animation:rippleOut ease-out forwards;}
@keyframes rippleOut{
  0%{transform:translate(-50%,-50%) scale(0);opacity:0;}
  10%{opacity:.9;}
  100%{transform:translate(-50%,-50%) scale(1);opacity:0;border-width:1px;}
}
/* 波纹层:缓慢流动的光纹,给背景一点动态感 */
.tt-ripple{position:absolute;inset:-10%;pointer-events:none;z-index:1;
  mix-blend-mode:screen;opacity:.5;
  background:
    radial-gradient(ellipse 60% 40% at 30% 40%,rgba(150,190,240,.14),transparent 60%),
    radial-gradient(ellipse 50% 60% at 70% 55%,rgba(120,160,220,.12),transparent 60%),
    repeating-linear-gradient(115deg,transparent 0 60px,rgba(180,210,255,.05) 60px 120px);
  animation:rippleFlow 16s ease-in-out infinite alternate;}
.tt-ripple::after{content:"";position:absolute;inset:0;
  background:
    radial-gradient(ellipse 55% 45% at 55% 35%,rgba(160,200,250,.1),transparent 62%),
    repeating-linear-gradient(65deg,transparent 0 80px,rgba(200,225,255,.04) 80px 160px);
  animation:rippleFlow2 22s ease-in-out infinite alternate;}
@keyframes rippleFlow{
  0%{transform:translate(0,0) scale(1);}
  100%{transform:translate(3%,-2%) scale(1.06);}
}
@keyframes rippleFlow2{
  0%{transform:translate(0,0) scale(1.04);}
  100%{transform:translate(-3%,2%) scale(1);}
}
/* 星尘层:JS 生成的亮点 */
.tt-stars{position:absolute;inset:0;pointer-events:none;}
.tt-stars .st{position:absolute;border-radius:50%;background:#fff;
  animation:twinkle linear infinite;}
@keyframes twinkle{
  0%{opacity:0;transform:translateY(0) scale(.6);}
  20%{opacity:1;}
  50%{opacity:.4;}
  80%{opacity:.9;}
  100%{opacity:0;transform:translateY(-24px) scale(1);}
}
#title-screen.hide{opacity:0;pointer-events:none}
.tt-wrap{position:relative;z-index:2;text-align:center;}

/* 故障 logo 图片:三层叠加,红青层故障帧错位 */
.tt-logo{position:relative;width:min(60vw,720px);margin:0 auto;
  animation:glitchJitter 4s steps(1) infinite;}
.tt-logo img{position:absolute;left:0;top:0;width:100%;height:auto;}
.tl-main{position:relative!important;
  filter:drop-shadow(0 0 30px rgba(234,244,255,.3));}
.tl-r{opacity:0;mix-blend-mode:screen;animation:glitchR 4s steps(1) infinite;}
.tl-c{opacity:0;mix-blend-mode:screen;animation:glitchC 4s steps(1) infinite;}
/* 红/青染色用 filter */
.tl-r{filter:sepia(1) saturate(6) hue-rotate(-40deg);}
.tl-c{filter:sepia(1) saturate(6) hue-rotate(120deg);}
@keyframes glitchJitter{
  0%,89%,100%{transform:none;}
  91%{transform:translate(-3px,1px);}
  92%{transform:translate(2px,-2px);}
  93%{transform:translate(-2px,0);}
  94%{transform:none;}
  61%{transform:translate(2px,0);}
  62%{transform:none;}
}
@keyframes glitchR{
  0%,89%,100%{opacity:0;transform:none;clip-path:inset(0 0 0 0);}
  90%{opacity:.7;transform:translate(-6px,-2px);clip-path:inset(20% 0 40% 0);}
  92%{opacity:.7;transform:translate(4px,1px);clip-path:inset(60% 0 8% 0);}
  94%{opacity:0;transform:none;}
  60%{opacity:.6;transform:translate(-5px,0);clip-path:inset(40% 0 30% 0);}
  62%{opacity:0;}
}
@keyframes glitchC{
  0%,89%,100%{opacity:0;transform:none;clip-path:inset(0 0 0 0);}
  90%{opacity:.7;transform:translate(6px,2px);clip-path:inset(50% 0 20% 0);}
  92%{opacity:.7;transform:translate(-4px,-1px);clip-path:inset(8% 0 60% 0);}
  94%{opacity:0;transform:none;}
  60%{opacity:.6;transform:translate(5px,0);clip-path:inset(25% 0 50% 0);}
  62%{opacity:0;}
}
/* 偶尔整体扫描线撕裂 */
.tt-main::selection{background:#3affe0;}

.tt-sub{color:#fff;letter-spacing:.06em;margin-top:-.6em;
  font-family:"Noto Sans SC",sans-serif;font-size:clamp(1.7rem,3.6vw,2.6rem);
  font-weight:600;text-shadow:0 0 16px rgba(0,0,0,.9),0 0 30px rgba(234,244,255,.25);
  animation:subFlicker 5s steps(1) infinite;}
@keyframes subFlicker{
  0%,97%,100%{opacity:.85;}
  98%{opacity:.4;}
  99%{opacity:.85;}
}
/* ===== 手机端:关闭水波扰动(卡),标题更大,副标题更小 ===== */
@media(max-width:760px){
  #title-screen .tt-cover{filter:blur(1.5px)!important;}  /* 去掉 feDisplacementMap */
  .tt-logo{width:min(92vw,560px);}                        /* 标题放大 */
  .tt-sub{font-size:1.15rem;letter-spacing:.04em;margin-top:-.3em;}  /* 副标题小两号 */
}
#start-btn{margin-top:3.4em;position:relative;z-index:2;
  background:rgba(0,0,0,.3);border:1px solid var(--line);
  color:var(--ink);padding:15px 46px;letter-spacing:.34em;cursor:pointer;
  font-family:"Noto Sans SC",sans-serif;border-radius:2px;font-size:.9rem;
  transition:all .35s;backdrop-filter:blur(2px);}
#start-btn:hover{border-color:var(--warm-deep);color:var(--warm);
  box-shadow:0 0 30px rgba(232,201,143,.12)}

@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.2s!important}
}
</style>
</head>
<body>

<div id="stage">
  <div id="scene"></div>

  <!-- 全局 SVG 滤镜:水泡扰动 + 水波纹 -->
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <!-- 缓慢水泡流动(阶段1/2) -->
      <filter id="bubble">
        <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02"
          numOctaves="2" seed="7" result="n">
          <animate attributeName="baseFrequency"
            dur="14s" values="0.012 0.02;0.02 0.03;0.012 0.02"
            repeatCount="indefinite"/>
        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="n"
          scale="34" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <!-- 更细密的水波纹(阶段3 立绘切换) -->
      <filter id="ripple">
        <feTurbulence type="turbulence" baseFrequency="0.02 0.035"
          numOctaves="2" seed="3" result="n">
          <animate attributeName="baseFrequency"
            dur="7s" values="0.02 0.035;0.035 0.05;0.02 0.035"
            repeatCount="indefinite"/>
        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="n"
          scale="22" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <!-- 封面背景水面扰动:大范围缓慢荡漾 -->
      <filter id="waterSurface">
        <feTurbulence type="fractalNoise" baseFrequency="0.008 0.014"
          numOctaves="2" seed="5" result="n">
          <animate attributeName="baseFrequency"
            dur="12s" values="0.008 0.014;0.012 0.02;0.008 0.014"
            repeatCount="indefinite"/>
        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="n"
          scale="18" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>

  <!-- 剪影舞台:三阶段共用容器 -->
  <div id="silhouette"></div>

  <div id="choices"></div>

  <div id="textbox">
    <div id="speaker"></div>
    <div id="dialogue"></div>
    <div id="continue-hint">▾ 点击继续</div>
  </div>
</div>

<!-- 开场标题 -->
<div id="title-screen">
  <div class="tt-cover"></div>
  <div class="tt-breathe"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
  <div class="tt-ripples"></div>
  <div class="tt-stars"></div>
  <div class="tt-wrap">
    <div class="tt-logo">
      <img class="tl-main" src="assets/cover/echo.png" alt="泰拉·回响">
      <img class="tl-r" src="assets/cover/echo.png" alt="" aria-hidden="true">
      <img class="tl-c" src="assets/cover/echo.png" alt="" aria-hidden="true">
    </div>
    <div class="tt-sub">找出属于你的明日方舟命定之人</div>
    <button id="start-btn">开始寻找</button>
  </div>
</div>

<!-- 结局显影 -->
<div id="ending">
  <!-- 显影舞台:眼睑开合 → 睁眼白光绽开 → 彩色立绘 → 移左 -->
  <div class="reveal-stage">
    <img class="rv-sil" alt="">        <!-- 朦胧发光白剪影(只见头) -->
    <img class="rv-real" alt="">       <!-- 彩色立绘 -->
    <div class="rv-bloom"></div>       <!-- 白光绽开 -->
  </div>
  <!-- 眼睛形状蒙版(SVG):黑色遮罩挖出杏仁形眼孔,开合眨眼 -->
  <svg class="eye-mask" viewBox="0 0 1440 860" preserveAspectRatio="xMidYMid slice">
    <defs>
      <mask id="eyeHole">
        <rect width="1440" height="860" fill="white"/>
        <path class="eye-shape" d="M 0 430 Q 720 120 1440 430 Q 720 740 0 430 Z" fill="black"/>
      </mask>
    </defs>
    <rect width="1440" height="860" fill="#000" mask="url(#eyeHole)"/>
  </svg>
  <!-- 镜头炫光层:眨眼白光后出现,screen 最上层 -->
  <div class="fx-flare">
    <div class="haze-wrap"></div>
    <div class="fx-flare-rect"></div>
    <div class="fx-flare-round"></div>
  </div>
  <!-- 半透明信息浮层 -->
  <div class="end-info">
    <div class="op-eyebrow">你要找的人是</div>
    <div class="op-name"></div>
    <div class="op-goldline"></div>
    <div class="op-ending"></div>
    <div class="end-actions">
      <button id="reunion">走近那个人</button>
      <button id="replay">再寻找一次</button>
    </div>
  </div>
</div>
<!-- 重逢剧情覆盖层(点"走近那个人"后拉起) -->
<div id="reunion-scene">
  <div class="rs-bg"></div>
  <div class="rs-textbox">
    <div class="rs-speaker"></div>
    <div class="rs-dialogue"></div>
    <div class="rs-hint">▾ 点击继续</div>
  </div>
</div>

<!-- 普瑞塞斯 meta 层 -->
<div id="meta">
  <div class="meta-inner">
    <div class="meta-tag">// SYSTEM OVERRIDE</div>
    <div id="meta-lines"></div>
    <button id="replay-meta" style="margin-top:2em;background:none;
      border:1px solid #1e4a5a;color:#4fd4ff;padding:12px 30px;
      letter-spacing:.24em;font-family:inherit;cursor:pointer;border-radius:2px">
      重新开始观测</button>
  </div>
</div>

<!-- 全局蓝色炫光背景层(CSS,替代 Blue_Gleam 视频) -->
<div id="global-flare" aria-hidden="true">
  <div class="gf-haze"></div>
  <div class="gf-beam gf-beam-a"></div>
  <div class="gf-beam gf-beam-b"></div>
  <div class="gf-orb gf-orb-a"></div>
  <div class="gf-orb gf-orb-b"></div>
</div>

<script src="data.js"></script>
<script src="ui.js"></script>
<script src="engine.js"></script>
<script>
  UI.initScene();

  // 标题页星尘:生成很多闪烁漂浮的亮点
  (function(){
    const box = document.querySelector(".tt-stars");
    if (box) {
      const N = 90;
      for (let i=0;i<N;i++){
        const s = document.createElement("div");
        s.className = "st";
        const size = Math.random()<0.8 ? (1+Math.random()*1.5) : (2+Math.random()*2.5);
        s.style.width = s.style.height = size+"px";
        s.style.left = Math.random()*100+"%";
        s.style.top = Math.random()*100+"%";
        s.style.animationDuration = (3+Math.random()*5)+"s";
        s.style.animationDelay = -(Math.random()*8)+"s";
        s.style.boxShadow = "0 0 "+(2+Math.random()*4)+"px rgba(255,255,255,.9)";
        box.appendChild(s);
      }
    }
  })();

  // 标题页水波涟漪:随机位置/大小,一圈圈荡开,不断刷新
  (function(){
    const box = document.querySelector(".tt-ripples");
    if (!box) return;
    function spawn(){
      const r = document.createElement("div");
      r.className = "ripple";
      // 最大直径 ~ 标题图宽度(min(60vw,720px)),有大有小
      const maxD = Math.min(window.innerWidth*0.6, 720);
      const d = maxD * (0.35 + Math.random()*0.65);
      r.style.width = r.style.height = d+"px";
      r.style.left = (10+Math.random()*80)+"%";
      r.style.top = (14+Math.random()*72)+"%";
      const dur = 4 + Math.random()*4;   // 荡开慢一点
      r.style.animationDuration = dur+"s";
      box.appendChild(r);
      setTimeout(()=>r.remove(), dur*1000+100);
    }
    // 初始铺几个,之后随机间隔不断刷新
    for(let i=0;i<3;i++) setTimeout(spawn, i*900);
    setInterval(()=>{ if(Math.random()<0.8) spawn(); }, 1300);
  })();

  document.getElementById("start-btn").addEventListener("click",()=>{
    document.getElementById("title-screen").classList.add("hide");
    setTimeout(()=>ENGINE.startGame(),700);
  });
  document.getElementById("replay").addEventListener("click",()=>location.reload());
  document.getElementById("replay-meta").addEventListener("click",()=>location.reload());
  document.getElementById("reunion").addEventListener("click",()=>UI.startReunion());
</script>
</body>
</html>
