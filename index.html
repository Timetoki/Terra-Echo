<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>回响 · 泰拉</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* 冷色记忆基调 —— 深蓝黑到暗青,白光为唯一亮部 */
  --bg-0:#070f18;      /* 最深背景 */
  --bg-1:#0a1420;      /* 场景底 */
  --ink:#dfe8f2;       /* 正文 */
  --ink-dim:#8296ac;   /* 次要文字 */
  --line:#1e3049;      /* 分隔/边框 */
  --glow:#eaf4ff;      /* 白光剪影 */
  --warm:#e8c98f;      /* 结局暖金,一次性介入 */
  --warm-deep:#c99a54;
  --panel:rgba(8,16,26,.82);
  --choice:rgba(18,32,50,.72);
  --choice-hi:rgba(34,58,88,.9);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg-0);
  color:var(--ink);
  font-family:"Noto Serif SC",Georgia,"Songti SC",serif;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ---- 舞台 ---- */
#stage{position:fixed;inset:0;display:flex;flex-direction:column;z-index:1;
  transition:background 1.2s ease;}
#scene{position:absolute;inset:0;overflow:hidden}

/* 场景氛围:漂浮的源石尘埃 */
.dust{position:absolute;width:2px;height:2px;border-radius:50%;
  background:var(--glow);opacity:0;pointer-events:none;
  animation:drift linear infinite}
@keyframes drift{
  0%{transform:translateY(105vh);opacity:0}
  10%{opacity:.5}
  90%{opacity:.5}
  100%{transform:translateY(-5vh);opacity:0}
}

/* ---- 白光剪影舞台(三阶段) ---- */
#silhouette{
  position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);
  width:min(52vh,400px);height:min(80vh,600px);
  pointer-events:none;
  transition:opacity 1.4s ease;
}
#silhouette.hidden{opacity:0}

/* 光晕(全阶段共用,阶段3减弱) */
#silhouette .halo{
  position:absolute;left:50%;top:50%;
  width:150%;height:150%;transform:translate(-50%,-50%);
  background:radial-gradient(ellipse at center,
    rgba(234,244,255,.28),rgba(234,244,255,.06) 45%,transparent 66%);
  filter:blur(10px);transition:opacity 1.2s;
}

/* 阶段1:一团很虚的模糊白光(柔光打底 + 湍流叠加) */
#silhouette .blob{
  position:absolute;left:50%;top:50%;
  width:70%;height:60%;transform:translate(-50%,-50%);
  background:radial-gradient(ellipse at 48% 42%,
    rgba(255,255,255,.85), rgba(234,244,255,.5) 34%,
    rgba(200,224,255,.22) 60%, transparent 78%);
  border-radius:48% 52% 55% 45% / 58% 48% 52% 42%;
  filter:url(#bubble) blur(22px);
  opacity:0;transition:opacity 1.4s;
  animation:blobPulse 11s ease-in-out infinite;
}
/* 叠一层更大更虚的外光晕,强化"虚幻白光"感 */
#silhouette .blob::after{
  content:"";position:absolute;left:50%;top:50%;
  width:150%;height:150%;transform:translate(-50%,-50%);
  background:radial-gradient(ellipse at center,
    rgba(234,244,255,.4),transparent 60%);
  filter:blur(30px);
}
@keyframes blobPulse{
  0%,100%{transform:translate(-50%,-50%) scale(1)   rotate(0deg)}
  33%    {transform:translate(-50%,-52%) scale(1.1)  rotate(3deg)}
  66%    {transform:translate(-50%,-49%) scale(.92) rotate(-3deg)}
}

/* 阶段2:很虚的模糊人影(白光人形,非实心) */
#silhouette .figure{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  filter:url(#bubble) blur(14px);
  opacity:0;transition:opacity 1.4s;
}
#silhouette .figure svg{width:100%;height:100%;
  filter:drop-shadow(0 0 24px rgba(234,244,255,.7));}
#silhouette .figure .form{fill:rgba(255,255,255,.72)}

/* 阶段3:放大的白色立绘剪影(用 mask 从透明底立绘取形,填白) */
#silhouette .portraits{
  position:fixed;left:50%;bottom:-16vh;top:auto;
  transform:translateX(-50%);
  width:min(100vh,760px);height:105vh;
  opacity:0;transition:opacity 1.2s;
  z-index:5;
}
#silhouette .portrait{
  position:absolute;inset:0;
  background-repeat:no-repeat;background-position:bottom center;
  background-size:contain;
  opacity:0;
  filter:url(#ripple) blur(9px) drop-shadow(0 0 26px rgba(234,244,255,.5));
  transition:opacity 1.1s ease;
}
#silhouette .portrait.active{opacity:.88}

/* ---- 剧情框 ---- */
#textbox{
  position:relative;margin-top:auto;
  background:linear-gradient(180deg,transparent,var(--panel) 22%);
  padding:clamp(28px,6vh,68px) clamp(20px,7vw,120px) clamp(30px,5vh,54px);
  min-height:34vh;display:flex;flex-direction:column;justify-content:flex-end;
}
#speaker{color:var(--warm);font-size:.86rem;letter-spacing:.28em;
  margin-bottom:.7em;min-height:1.1em;font-family:"Noto Sans SC",sans-serif;}
#dialogue{font-size:clamp(1.02rem,2.2vw,1.34rem);line-height:2;
  max-width:52em;min-height:3.6em;}
#dialogue .cursor{display:inline-block;width:.5em;color:var(--warm);
  animation:blink 1s step-start infinite}
@keyframes blink{50%{opacity:0}}

/* 继续提示 */
#continue-hint{margin-top:1.2em;color:var(--ink-dim);font-size:.82rem;
  letter-spacing:.2em;opacity:0;transition:opacity .4s;
  font-family:"Noto Sans SC",sans-serif;}
#continue-hint.show{opacity:.7}

/* ---- 选项卡 ---- */
#choices{position:absolute;left:0;right:0;bottom:calc(34vh + 12px);
  display:flex;flex-direction:column;gap:12px;align-items:center;
  padding:0 clamp(20px,7vw,120px);pointer-events:none;}
.choice{
  pointer-events:auto;width:min(52em,100%);
  background:var(--choice);border:1px solid var(--line);
  color:var(--ink);text-align:left;
  padding:16px 22px;font-size:clamp(.94rem,1.9vw,1.08rem);
  font-family:"Noto Sans SC",sans-serif;line-height:1.6;
  cursor:pointer;border-radius:2px;
  transform:translateY(8px);opacity:0;
  transition:background .25s,border-color .25s,transform .4s,opacity .4s;
  backdrop-filter:blur(3px);
}
.choice:hover,.choice:focus-visible{
  background:var(--choice-hi);border-color:#3c6294;outline:none;
  transform:translateY(0) translateX(4px);
}
.choice.in{transform:translateY(0);opacity:1}

/* ---- 结局显影(眼睑开合→睁眼白光绽开→彩色立绘→移左) ---- */
#ending{position:fixed;inset:0;background:#000;
  display:none;z-index:40;opacity:0;transition:opacity .8s ease;}
#ending.show{display:block;opacity:1}

/* 斜切黑白:三折线 左→右→左(顶边偏右起,先向左切,再向右凸,再向左落到底) */
.skew-bg{position:absolute;inset:0;z-index:0;overflow:hidden;opacity:0;
  transition:opacity .55s ease;}
#ending.shifted .skew-bg{opacity:1;}
.skew-white,.skew-black{position:absolute;inset:0;}
.skew-white{
  background:
    repeating-linear-gradient(0deg,transparent 0 47px,rgba(0,0,0,.035) 47px 48px),
    repeating-linear-gradient(90deg,transparent 0 47px,rgba(0,0,0,.035) 47px 48px),
    #efefef;
  clip-path:polygon(0 0, 55% 0, 50% 20%, 55% 38%, 50% 57%, 53% 77%, 52% 100%, 0 100%);
  transform:translateX(-18%);
  transition:transform 1.05s cubic-bezier(.16,.82,.28,1);}
.skew-black{
  background:
    radial-gradient(ellipse 70% 50% at 70% 40%,rgba(40,48,58,.55),transparent 70%),
    repeating-linear-gradient(135deg,transparent 0 18px,rgba(255,255,255,.018) 18px 19px),
    #111214;
  clip-path:polygon(55% 0, 100% 0, 100% 100%, 52% 100%, 53% 77%, 50% 57%, 55% 38%, 50% 20%);
  transform:translateX(18%);
  transition:transform 1.05s cubic-bezier(.16,.82,.28,1);}
#ending.shifted .skew-white,#ending.shifted .skew-black{transform:none;}
.skew-cut{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;
  overflow:visible;}
.skew-cut .burn-far{fill:none;stroke:#d05e14;stroke-width:18;
  stroke-linejoin:round;stroke-linecap:round;
  filter:blur(12px);opacity:.5;mix-blend-mode:screen;}
.skew-cut .burn-mid{fill:none;stroke:#ffc27a;stroke-width:8;
  stroke-linejoin:round;stroke-linecap:round;
  filter:blur(5px);opacity:.82;mix-blend-mode:screen;}
.skew-cut .burn-hot{fill:none;stroke:#fff8ee;stroke-width:3;
  stroke-linejoin:round;stroke-linecap:round;
  filter:blur(1.6px);opacity:.95;mix-blend-mode:screen;}
.skew-cut .burn-edge{fill:none;stroke:rgba(255,248,235,.3);stroke-width:1;
  stroke-linejoin:round;stroke-linecap:round;
  vector-effect:non-scaling-stroke;}
.sw-deco{position:absolute;inset:0;pointer-events:none;}
.sw-marks{position:absolute;top:18px;left:22px;display:flex;gap:18px;
  font-family:"Noto Serif SC","Songti SC","SimSun",serif;font-size:12px;letter-spacing:.28em;
  color:#9aa3ad;}
.sw-circuit{position:absolute;left:18px;top:48px;width:min(38vw,420px);height:2px;
  background:linear-gradient(90deg,#1a1a1a,transparent);
  box-shadow:0 0 0 1px rgba(0,0,0,.06);}
.sw-circuit::before,.sw-circuit::after{content:"";position:absolute;width:7px;height:7px;
  border:1px solid #1a1a1a;border-radius:50%;top:-3px;background:#efefef;}
.sw-circuit::before{left:0;} .sw-circuit::after{left:42%;}
.sb-meta{position:absolute;top:22px;right:28px;text-align:right;color:#c8cdd3;
  font-family:"Noto Serif SC","Songti SC","SimSun",serif;opacity:0;
  transform:translateX(24px);transition:opacity .7s .35s,transform .7s .35s;}
#ending.shifted .sb-meta{opacity:1;transform:none;}
.sb-data-no{font-size:11px;letter-spacing:.22em;}
.sb-data-no b{font-size:13px;font-weight:700;color:#fff;margin-left:.4em;}
.sb-barcode{margin-top:8px;margin-left:auto;width:132px;height:28px;
  background:repeating-linear-gradient(90deg,
    #e8e8e8 0 2px,transparent 2px 4px,#e8e8e8 4px 5px,transparent 5px 8px,
    #e8e8e8 8px 11px,transparent 11px 13px,#e8e8e8 13px 14px,transparent 14px 16px);}

/* 显影舞台:绽开后立绘落到白区(折线左侧),压过灼边 */
.reveal-stage{position:absolute;top:50%;left:50%;
  width:min(150vh,1100px);height:min(150vh,1100px);
  transform:translate(-50%,-50%);z-index:3;
  transition:left 1.15s cubic-bezier(.16,.82,.28,1),
             width 1.15s cubic-bezier(.16,.82,.28,1),
             height 1.15s cubic-bezier(.16,.82,.28,1);}
#ending.shifted .reveal-stage{left:30%;
  width:min(92vh,720px);height:min(128vh,980px);}
@media(max-width:760px){
  .reveal-stage{width:130vw;height:130vw;top:48%;}
  #ending.shifted .reveal-stage{left:38%;width:118vw;height:118vw;top:52%;}
}

/* 朦胧发光白剪影:眨眼时露头,缩小(不要太大) */
.rv-sil{position:absolute;inset:0;width:100%;height:100%;
  object-fit:contain;object-position:center 40%;
  opacity:0;transform:scale(1.15);
  filter:blur(9px) brightness(1.5) drop-shadow(0 0 40px rgba(234,244,255,.65));}
#ending.blink .rv-sil{opacity:.9;}
#ending.bloomed .rv-sil{opacity:0 !important;animation:none !important;
  transition:opacity .5s ease;}

/* 眼睛形状蒙版(SVG):杏仁眼孔开合 */
.eye-mask{position:absolute;inset:0;width:100%;height:100%;z-index:6;
  pointer-events:none;opacity:1;transition:opacity .7s ease;}
.eye-shape{transform-box:fill-box;transform-origin:center;transform:scaleY(.04);}
#ending.blink .eye-shape{animation:eyeBlink 2.8s ease forwards;}
@keyframes eyeBlink{
  0%{transform:scaleY(.04);}    /* 几乎闭合 */
  12%{transform:scaleY(.72);}   /* 睁开 */
  22%{transform:scaleY(.2);}    /* 眨1 */
  33%{transform:scaleY(.8);}    /* 睁开 */
  43%{transform:scaleY(.16);}   /* 眨2 */
  58%{transform:scaleY(.5);}    /* 开始最终睁开 */
  100%{transform:scaleY(2.6);}  /* 缓缓睁到最大(后段放慢) */
}
/* 睁大后眼罩平滑淡出(不硬切、不跳变) */
#ending.bloomed .eye-mask{opacity:0;}

/* 白光绽开:中心亮核 + 水波涟漪环,停留更久 */
.rv-bloom{position:absolute;left:50%;top:42%;width:10%;height:10%;
  transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,#fff,rgba(234,244,255,.9) 28%,transparent 68%);
  opacity:0;pointer-events:none;z-index:5;
  filter:url(#ripple);}
#ending.bloomed .rv-bloom{animation:bloom 2s cubic-bezier(.2,.6,.25,1) forwards;}
@keyframes bloom{
  0%{opacity:0;width:6%;height:6%;}
  18%{opacity:1;}
  50%{opacity:1;width:120%;height:120%;}   /* 中段保持最亮,停留久 */
  70%{opacity:.85;}
  100%{opacity:0;width:260%;height:260%;}
}
/* 水波涟漪环:向外扩散的光环 */
.rv-bloom::before,.rv-bloom::after{content:"";position:absolute;
  left:50%;top:50%;width:100%;height:100%;
  transform:translate(-50%,-50%);border-radius:50%;
  border:2px solid rgba(234,244,255,.6);opacity:0;}
#ending.bloomed .rv-bloom::before{animation:rippleRing 2s ease-out .1s forwards;}
#ending.bloomed .rv-bloom::after{animation:rippleRing 2s ease-out .5s forwards;}
@keyframes rippleRing{
  0%{opacity:.7;width:20%;height:20%;border-width:3px;}
  100%{opacity:0;width:320%;height:320%;border-width:0;}
}

/* 彩色立绘:绽开后浮现。object-position 下移一档,露出头顶不被切 */
.rv-real{position:absolute;inset:0;width:100%;height:100%;
  object-fit:contain;object-position:center 78%;z-index:2;
  opacity:0;transform:scale(1.1);}
#ending.bloomed .rv-real{opacity:1;transform:scale(1);
  transition:opacity 1.3s ease .85s,transform 1.5s cubic-bezier(.3,.7,.3,1) .85s;}

/* 白底立绘:纯白人形,100%不透明,垫在彩色立绘侧后方偏右、略大;外沿辉光流动呼吸 */
.rv-back{position:absolute;inset:0;width:100%;height:100%;
  object-fit:contain;object-position:center 78%;z-index:1;
  opacity:0;transform:translateX(8%) scale(1.16);
  filter:drop-shadow(0 0 18px rgba(190,220,255,.7));}
#ending.bloomed .rv-back{opacity:1;
  animation:backGlow 4.5s ease-in-out infinite;
  transition:opacity 1.4s ease .95s;}
#ending.shifted .rv-back{opacity:1;}
@keyframes backGlow{
  0%,100%{filter:drop-shadow(0 0 14px rgba(190,220,255,.55))
                 drop-shadow(0 0 30px rgba(150,190,255,.28));}
  50%{filter:drop-shadow(0 0 26px rgba(224,238,255,.85))
             drop-shadow(0 0 54px rgba(170,205,255,.5));}
}

/* ===== 全局蓝色炫光背景层(纯 CSS,替代 Blue_Gleam 视频) ===== */
/* 垫在所有内容之下(z0),全程循环:蓝色柔光呼吸 + 斜向光束扫动 + 光晕脉动 */
#global-flare{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 40%,#0a1626 0%,#070f18 70%);}
#global-flare > *{position:absolute;mix-blend-mode:screen;will-change:transform,opacity;}
/* 几团蓝色柔光,缓慢呼吸漂移 */
.gf-haze{inset:-20%;
  background:
    radial-gradient(38% 32% at 26% 30%,rgba(74,140,220,.34),transparent 70%),
    radial-gradient(42% 36% at 74% 66%,rgba(60,120,200,.30),transparent 72%),
    radial-gradient(30% 40% at 52% 82%,rgba(96,160,235,.22),transparent 70%);
  filter:blur(40px);animation:gfBreathe 16s ease-in-out infinite;}
@keyframes gfBreathe{
  0%,100%{transform:translate3d(0,0,0) scale(1);opacity:.7;}
  50%{transform:translate3d(2%,-2%,0) scale(1.08);opacity:1;}
}
/* 斜向光束,极慢横扫 */
.gf-beam{top:-30%;width:44%;height:160%;filter:blur(46px);opacity:0;
  background:linear-gradient(180deg,transparent,
    rgba(120,180,255,.18) 30%,rgba(160,205,255,.42) 50%,rgba(120,180,255,.18) 70%,transparent);
  transform:rotate(14deg);}
.gf-beam-a{left:-30%;animation:gfSweepA 19s ease-in-out infinite;}
.gf-beam-b{left:-10%;animation:gfSweepB 27s ease-in-out infinite;animation-delay:-9s;}
@keyframes gfSweepA{
  0%{transform:translateX(-20%) rotate(14deg);opacity:0;}
  25%,60%{opacity:.9;}
  100%{transform:translateX(220%) rotate(14deg);opacity:0;}
}
@keyframes gfSweepB{
  0%{transform:translateX(-10%) rotate(-11deg);opacity:0;}
  30%,65%{opacity:.7;}
  100%{transform:translateX(180%) rotate(-11deg);opacity:0;}
}
/* 蓝色光晕,明暗脉动 */
.gf-orb{border-radius:50%;filter:blur(50px);
  background:radial-gradient(circle at 50% 50%,rgba(150,200,255,.5),rgba(80,140,220,.22) 45%,transparent 70%);}
.gf-orb-a{top:-12%;left:-8%;width:42vw;height:42vw;animation:gfPulse 13s ease-in-out infinite;}
.gf-orb-b{bottom:-16%;right:-10%;width:52vw;height:52vw;animation:gfPulse 17s ease-in-out infinite;animation-delay:-6s;}
@keyframes gfPulse{
  0%,100%{opacity:.28;transform:scale(1);}
  50%{opacity:.6;transform:scale(1.12);}
}
@media(max-width:760px){
  /* 手机端:降 blur、去一条光束,省性能 */
  .gf-haze{filter:blur(28px);}
  .gf-beam-b{display:none;}
  .gf-orb{filter:blur(34px);}
}
/* 镜头炫光:柔光晕染垫底 + 横向长方形光带扫过 + 左上角圆形光晕,screen 叠最上层 */
.fx-flare{position:fixed;inset:0;z-index:20;pointer-events:none;
  mix-blend-mode:screen;opacity:0;transition:opacity 1.4s ease;overflow:hidden;}
#ending.bloomed .fx-flare{opacity:1;}
/* 几团很虚的柔光晕染,JS 生成 6 团 */
.fx-flare .haze{position:absolute;border-radius:50%;filter:blur(60px);
  background:radial-gradient(circle at 42% 40%,
    rgba(224,238,255,.55),rgba(180,210,255,.22) 55%,transparent 78%);
  animation:hazeDrift ease-in-out infinite;}
@keyframes hazeDrift{
  0%,100%{transform:translate(0,0) scale(1);opacity:.35;}
  50%{transform:translate(var(--hx),var(--hy)) scale(1.12);opacity:.7;}
}
/* 横向长方形光带:画面中部横扫一次 */
.fx-flare-rect{position:absolute;top:46%;left:0;width:60%;height:20%;
  transform:translateX(-120%) skewX(-8deg);
  background:linear-gradient(90deg,transparent,
    rgba(210,232,255,.16) 30%,rgba(255,255,255,.55) 50%,rgba(210,232,255,.16) 70%,transparent);
  filter:blur(14px);opacity:0;}
#ending.shifted .fx-flare-rect{animation:sweepRect 2.8s cubic-bezier(.25,.5,.3,1) .1s;}
@keyframes sweepRect{
  0%{transform:translateX(-120%) skewX(-8deg);opacity:0;}
  18%{opacity:1;}
  82%{opacity:1;}
  100%{transform:translateX(240%) skewX(-8deg);opacity:0;}
}
/* 左上角圆形光晕:亮起一次 */
.fx-flare-round{position:absolute;top:-8%;left:-6%;width:38vw;height:38vw;
  border-radius:50%;filter:blur(30px);opacity:0;
  background:radial-gradient(circle at 50% 50%,
    rgba(255,255,255,.7),rgba(210,232,255,.32) 45%,transparent 70%);}
#ending.shifted .fx-flare-round{animation:sweepRound 3s ease-in-out .2s;}
@keyframes sweepRound{
  0%{opacity:0;transform:scale(.7);}
  30%{opacity:.9;transform:scale(1);}
  60%{opacity:.5;transform:scale(1.08);}
  100%{opacity:0;transform:scale(1.15);}
}



/* 左白区信息:仅保留 kicker(测试结束) */
.end-info{position:absolute;top:0;left:0;z-index:5;
  padding:72px 4vw 24px 4.5vw;
  font-family:"Noto Serif SC","Songti SC","SimSun","Noto Serif CJK SC",serif;
  opacity:0;transform:translateX(-48px);
  transition:opacity 1s cubic-bezier(.16,.82,.28,1) .15s,
             transform 1.05s cubic-bezier(.16,.82,.28,1) .15s;}
#ending.shifted .end-info{opacity:1;transform:none;}
.op-kicker{
  font-size:clamp(.72rem,1.4vw,.9rem);letter-spacing:.28em;color:#1a1a1a;font-weight:700;
  text-shadow:0 0 12px rgba(255,255,255,.8);}

/* 右黑区:问句(白字)独立钉右上 */
.op-ask{position:absolute;top:74px;right:3.4vw;z-index:5;
  text-align:right;max-width:min(40vw,520px);
  font-family:"Noto Serif SC","Songti SC","SimSun","Noto Serif CJK SC",serif;
  opacity:0;transform:translateX(48px);
  transition:opacity 1s cubic-bezier(.16,.82,.28,1) .3s,
             transform 1.05s cubic-bezier(.16,.82,.28,1) .3s;}
#ending.shifted .op-ask{opacity:1;transform:none;}
/* 身份卡浮层靠右下 */
.end-right{position:absolute;bottom:96px;right:0;z-index:5;
  width:min(34vw,440px);padding:0 3.4vw 0 2vw;
  display:flex;flex-direction:column;align-items:flex-end;
  font-family:"Noto Serif SC","Songti SC","SimSun","Noto Serif CJK SC",serif;
  opacity:0;transform:translateX(48px);
  transition:opacity 1s cubic-bezier(.16,.82,.28,1) .3s,
             transform 1.05s cubic-bezier(.16,.82,.28,1) .3s;}
#ending.shifted .end-right{opacity:1;transform:none;}
.op-ask-l,.op-ask-r{display:block;font-size:clamp(.92rem,1.8vw,1.12rem);
  letter-spacing:.18em;color:#e8edf3;text-shadow:0 1px 12px rgba(0,0,0,.6);}
.op-name{font-size:clamp(3rem,6.6vw,5.8rem);letter-spacing:.08em;
  color:#fff;line-height:.95;font-weight:700;margin:.18em 0 .12em;
  font-family:"Noto Serif SC","Songti SC","SimSun","Noto Serif CJK SC",serif;
  text-shadow:0 2px 22px rgba(0,0,0,.7),0 0 40px rgba(120,160,220,.35);}
.id-card{border:1px solid rgba(200,210,225,.4);background:rgba(14,18,26,.62);
  padding:14px 16px 16px;max-width:360px;width:100%;text-align:left;
  display:grid;grid-template-columns:44px 1fr;gap:7px 14px;align-items:center;
  backdrop-filter:blur(8px);}
.id-mark{grid-row:1 / span 8;width:44px;height:44px;align-self:start;margin-top:4px;
  border:1px solid #cdd4de;
  background:conic-gradient(from 45deg,#cdd4de 0 25%,transparent 0 50%,#cdd4de 0 75%,transparent 0);
  box-shadow:inset 0 0 0 10px rgba(14,18,26,.62);}
.id-title{grid-column:2;font-size:12px;letter-spacing:.32em;color:#eef1f6;font-weight:700;}
.id-row{grid-column:2;display:flex;justify-content:space-between;gap:12px;align-items:baseline;
  font-size:13px;letter-spacing:.08em;
  border-top:1px solid rgba(255,255,255,.14);padding-top:5px;color:#9aa3b0;}
.id-row span{flex:0 0 4.2em;}
.id-row b{color:#f2f5fa;font-weight:700;letter-spacing:.04em;text-align:right;line-height:1.35;}
#replay{grid-column:2;justify-self:start;margin-top:4px;background:none;
  border:1px solid #cdd4de;color:#eef1f6;padding:8px 14px;letter-spacing:.28em;
  font-family:"Noto Serif SC","Songti SC","SimSun","Noto Serif CJK SC",serif;font-size:13px;cursor:pointer;}
#replay:hover{background:#eef1f6;color:#111;}

.pull-bar{position:absolute;left:0;right:0;bottom:0;z-index:8;height:78px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;cursor:pointer;user-select:none;
  background:linear-gradient(180deg,transparent 0%,rgba(8,8,10,.55) 28%,rgba(8,8,10,.92));
  color:#f3ead8;font-family:"Noto Serif SC","Songti SC","SimSun",serif;
  border-top:1px solid rgba(255,214,150,.55);
  opacity:0;transform:translateY(16px);
  transition:transform .6s .4s;}
#ending.shifted .pull-bar{transform:none;animation:pullPulse 1.25s ease-in-out infinite;}
@keyframes pullPulse{
  0%,100%{opacity:.62;box-shadow:0 -8px 22px rgba(255,196,120,.12);}
  50%{opacity:1;box-shadow:0 -12px 36px rgba(255,220,160,.55),inset 0 0 24px rgba(255,210,140,.18);}
}
.pull-bar .pb-side{font-size:12px;letter-spacing:.28em;opacity:.7;}
.pull-bar .pb-mid{display:flex;flex-direction:column;align-items:center;gap:7px;
  font-size:15px;letter-spacing:.28em;font-weight:700;}
.pull-bar .pb-mid i{display:block;width:56px;height:5px;border-radius:3px;
  background:#ffe7b8;box-shadow:0 0 12px rgba(255,220,160,.9);
  animation:pullChev .9s ease-in-out infinite;}
@keyframes pullChev{
  0%,100%{transform:translateY(0);opacity:.55;}
  50%{transform:translateY(-5px);opacity:1;}
}
.pull-bar .pb-mid span{text-shadow:0 0 12px rgba(255,220,160,.45);}

#reunion-scene{position:fixed;inset:0;z-index:50;display:none;
  background:rgba(8,10,14,.62);backdrop-filter:blur(10px);
  transform:translateY(100%);transition:transform .7s cubic-bezier(.2,.7,.2,1);}
#reunion-scene.show{display:block}
#reunion-scene.up{transform:translateY(0)}
#reunion-scene::before{content:"";position:absolute;left:50%;top:14px;
  transform:translateX(-50%);width:46px;height:4px;border-radius:2px;
  background:rgba(234,244,255,.45);z-index:2;}
#reunion-scene .rs-bg{position:absolute;inset:0;
  background-repeat:no-repeat;background-size:contain;background-position:center 18%;
  opacity:.16;filter:grayscale(.2);}
.rs-textbox{position:absolute;left:8vw;right:8vw;bottom:8vh;
  background:rgba(10,14,20,.55);border:1px solid rgba(220,230,245,.16);
  padding:clamp(22px,4vh,40px) clamp(20px,4vw,48px);
  min-height:28vh;display:flex;flex-direction:column;justify-content:flex-end;

.rs-speaker{color:var(--warm);font-size:.86rem;letter-spacing:.28em;

.rs-dialogue{font-size:clamp(1.02rem,2.2vw,1.34rem);line-height:2;max-width:52em;

.rs-hint{margin-top:1.2em;color:var(--ink-dim);font-size:.82rem;letter-spacing:.2em;

.rs-hint.show{opacity:.7}

@media(max-width:760px){
  #ending{overflow:hidden;}
  .end-info{width:auto;padding:44px 5vw 0 5vw;}
  /* 右侧浮层在手机改为底部全宽,靠左对齐 */
  .end-right{top:auto;bottom:96px;right:auto;left:0;
    width:100%;padding:0 5vw;align-items:flex-start;text-align:left;}

  .op-name{font-size:clamp(2.3rem,11.5vw,3.4rem);letter-spacing:.02em;

  .id-card{max-width:none;width:100%;margin-top:12px;

  /* 单独手机适配:关闭整块 opacity 明灭(闪烁),文字常亮,只保留底部辉光呼吸 */
  #ending.shifted .pull-bar{animation:pullGlowM 1.6s ease-in-out infinite;opacity:1;}
  @keyframes pullGlowM{
    0%,100%{box-shadow:0 -8px 22px rgba(255,196,120,.14);}

/* ---- 普瑞塞斯 meta 前置层(在所有 UI 之前) ---- */
#meta{position:fixed;inset:0;z-index:90;display:none;
  background:#02060b;color:#c9f0ff;
  align-items:center;justify-content:center;flex-direction:column;
  font-family:"Noto Sans SC",monospace,sans-serif;}
#meta.show{display:flex}
#meta::before{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,
    rgba(120,220,255,.03) 0px,rgba(120,220,255,.03) 1px,
    transparent 1px,transparent 3px);pointer-events:none;}
.meta-inner{max-width:640px;padding:40px;position:relative;z-index:2}
.meta-tag{color:#4fd4ff;letter-spacing:.4em;font-size:.74rem;
  margin-bottom:2.4em;opacity:.7}
#meta-lines p{font-size:clamp(1.02rem,2.2vw,1.28rem);line-height:2.1;
  margin-bottom:1.2em;opacity:0;transform:translateX(-6px);}
#meta-lines p.in{opacity:1;transform:translateX(0);
  transition:opacity .8s,transform .8s;}
.meta-name{color:#eaf4ff;font-size:2rem;letter-spacing:.3em;
  margin:1.4em 0;text-shadow:0 0 30px rgba(120,220,255,.5);}

/* ===== 普瑞塞斯跳脸层(在所有 UI 之前) ===== */
#priestess{position:fixed;inset:0;z-index:9999;display:none;
  background:transparent;overflow:hidden;pointer-events:none;}
#priestess.show{display:block;pointer-events:auto;}
.pr-portrait{position:absolute;left:50%;top:0;
  transform:translateX(-50%) scale(1.9);transform-origin:center top;
  width:min(96vh,760px);height:auto;object-fit:contain;object-position:center top;
  filter:drop-shadow(0 0 60px rgba(150,120,255,.4)) contrast(1.05);}
#priestess.broken .pr-portrait{animation:prShatter .12s steps(1) infinite;
  filter:contrast(1.4) saturate(1.3) hue-rotate(8deg)
    drop-shadow(3px 0 0 rgba(255,0,80,.6)) drop-shadow(-3px 0 0 rgba(0,220,255,.6));}
@keyframes prShatter{
  0%{clip-path:polygon(0 0,100% 0,100% 18%,0 22%);transform:translateX(-46%) scale(1.9);}
  20%{clip-path:polygon(0 20%,100% 16%,100% 40%,0 38%);transform:translateX(-54%) scale(1.92);}
  40%{clip-path:polygon(0 36%,100% 42%,100% 60%,0 56%);transform:translateX(-48%) scale(1.88);}
  60%{clip-path:polygon(0 58%,100% 54%,100% 78%,0 82%);transform:translateX(-52%) scale(1.9);}
  80%{clip-path:polygon(0 76%,100% 80%,100% 100%,0 98%);transform:translateX(-50%) scale(1.91);}
  100%{clip-path:none;transform:translateX(-50%) scale(1.9);}
}
.pr-glitch{position:absolute;inset:0;z-index:3;mix-blend-mode:screen;
  pointer-events:none;opacity:.9;
  background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(255,0,90,.05) 2px 3px),
    linear-gradient(90deg,rgba(255,0,90,.12),transparent 20%,transparent 80%,rgba(0,220,255,.12));
  animation:prGlitch .28s steps(2) infinite;}
@keyframes prGlitch{
  0%{transform:translate(0,0);clip-path:inset(0 0 0 0);}
  25%{transform:translate(-6px,2px);clip-path:inset(12% 0 60% 0);}
  50%{transform:translate(5px,-3px);clip-path:inset(48% 0 20% 0);}
  75%{transform:translate(-3px,4px);clip-path:inset(70% 0 8% 0);}
  100%{transform:translate(0,0);clip-path:inset(0 0 0 0);}
}
.pr-scanlines{position:absolute;inset:0;z-index:4;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px);
  mix-blend-mode:multiply;opacity:.6;}
.pr-scanlines::after{content:"";position:absolute;left:0;right:0;height:8%;
  background:linear-gradient(180deg,transparent,rgba(180,220,255,.14),transparent);
  animation:prBar 2.4s linear infinite;}
@keyframes prBar{0%{top:-10%}100%{top:110%}}
.pr-dialogue{position:absolute;z-index:8;left:50%;top:44%;
  transform:translateX(-50%);text-align:center;
  width:min(46em,86vw);color:#fff;font-size:clamp(1.1rem,2.4vw,1.5rem);
  line-height:1.9;letter-spacing:.06em;
  text-shadow:0 0 18px rgba(150,180,255,.5),2px 0 0 rgba(255,0,80,.3),-2px 0 0 rgba(0,220,255,.3);
  font-family:"Noto Sans SC",sans-serif;
  opacity:0;transition:opacity 1.2s ease;}
.pr-dialogue.show{opacity:1;}
@media(max-width:760px){.pr-dialogue{top:44%;width:88vw;font-size:1.14rem;}}
/* 5 个红"好":竖排,屏幕中央,复用普通选项 .choice 格式,只是红色,缓缓渐现 */
.pr-confirm{position:absolute;z-index:7;left:0;right:0;top:50%;
  transform:translateY(-50%);
  display:flex;flex-direction:column;gap:12px;align-items:center;
  padding:0 clamp(20px,7vw,120px);opacity:0;transition:opacity 1s ease;}
.pr-confirm.show{opacity:1;}
.pr-confirm button{pointer-events:auto;width:min(52em,100%);text-align:center;
  background:rgba(120,0,26,.72);border:1px solid #ff2b4d;color:#fff;
  padding:16px 22px;font-size:clamp(.94rem,1.9vw,1.08rem);
  font-family:"Noto Sans SC",sans-serif;line-height:1.6;cursor:pointer;border-radius:2px;
  letter-spacing:.4em;text-shadow:0 0 10px rgba(255,60,90,.7);
  box-shadow:0 0 20px rgba(255,20,60,.3);backdrop-filter:blur(3px);
  transition:background .25s,box-shadow .25s,transform .3s;}
.pr-confirm button:hover{background:rgba(180,0,38,.9);
  box-shadow:0 0 32px rgba(255,20,60,.6);transform:translateX(4px);}
#priestess.glitchout .pr-glitch{animation-duration:.08s;opacity:1;}
#priestess.glitchout .pr-portrait{animation:prShatter .06s steps(1) infinite;}
.pr-blackout{position:absolute;inset:0;z-index:20;background:#000;
  opacity:0;transition:opacity .3s;}
.pr-blackout.on{opacity:1;}
#priestess.rescued .pr-glitch,#priestess.rescued .pr-scanlines{opacity:0;transition:opacity .6s;}
#priestess.rescued .pr-portrait{animation:none;filter:drop-shadow(0 0 40px rgba(120,200,255,.35));}

/* ---- 开场标题 ---- */
#title-screen{position:fixed;inset:0;z-index:60;background:#000;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  transition:opacity 1s;overflow:hidden;}
/* 封面背景层 */
#title-screen .tt-cover{position:absolute;inset:-4%;
  background:url("assets/cover/cover.png") center/cover no-repeat;
  filter:url(#waterSurface) blur(1px);}
#title-screen::before{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.55));}
/* 黑色底布:整体压暗回灰(静态,更暗) */
.tt-breathe{position:absolute;inset:0;pointer-events:none;
  background:rgba(0,0,0,.56);}
/* 一圈圈荡开的水波涟漪 */
.tt-ripples{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.tt-ripples .ripple{position:absolute;border-radius:50%;
  border:2.5px solid rgba(220,238,255,.85);
  box-shadow:0 0 12px rgba(200,230,255,.4);
  transform:translate(-50%,-50%) scale(0);opacity:0;
  animation:rippleOut ease-out forwards;}
@keyframes rippleOut{
  0%{transform:translate(-50%,-50%) scale(0);opacity:0;}
  10%{opacity:.9;}
  100%{transform:translate(-50%,-50%) scale(1);opacity:0;border-width:1px;}
}
/* 波纹层:缓慢流动的光纹,给背景一点动态感 */
.tt-ripple{position:absolute;inset:-10%;pointer-events:none;z-index:1;
  mix-blend-mode:screen;opacity:.5;
  background:
    radial-gradient(ellipse 60% 40% at 30% 40%,rgba(150,190,240,.14),transparent 60%),
    radial-gradient(ellipse 50% 60% at 70% 55%,rgba(120,160,220,.12),transparent 60%),
    repeating-linear-gradient(115deg,transparent 0 60px,rgba(180,210,255,.05) 60px 120px);
  animation:rippleFlow 16s ease-in-out infinite alternate;}
.tt-ripple::after{content:"";position:absolute;inset:0;
  background:
    radial-gradient(ellipse 55% 45% at 55% 35%,rgba(160,200,250,.1),transparent 62%),
    repeating-linear-gradient(65deg,transparent 0 80px,rgba(200,225,255,.04) 80px 160px);
  animation:rippleFlow2 22s ease-in-out infinite alternate;}
@keyframes rippleFlow{
  0%{transform:translate(0,0) scale(1);}
  100%{transform:translate(3%,-2%) scale(1.06);}
}
@keyframes rippleFlow2{
  0%{transform:translate(0,0) scale(1.04);}
  100%{transform:translate(-3%,2%) scale(1);}
}
/* 星尘层:JS 生成的亮点 */
.tt-stars{position:absolute;inset:0;pointer-events:none;}
.tt-stars .st{position:absolute;border-radius:50%;background:#fff;
  animation:twinkle linear infinite;}
@keyframes twinkle{
  0%{opacity:0;transform:translateY(0) scale(.6);}
  20%{opacity:1;}
  50%{opacity:.4;}
  80%{opacity:.9;}
  100%{opacity:0;transform:translateY(-24px) scale(1);}
}
#title-screen.hide{opacity:0;pointer-events:none}
.tt-wrap{position:relative;z-index:2;text-align:center;}

/* 故障 logo 图片:三层叠加,红青层故障帧错位 */
.tt-logo{position:relative;width:min(60vw,720px);margin:0 auto;
  animation:glitchJitter 4s steps(1) infinite;}
.tt-logo img{position:absolute;left:0;top:0;width:100%;height:auto;}
.tl-main{position:relative!important;
  filter:drop-shadow(0 0 30px rgba(234,244,255,.3));}
.tl-r{opacity:0;mix-blend-mode:screen;animation:glitchR 4s steps(1) infinite;}
.tl-c{opacity:0;mix-blend-mode:screen;animation:glitchC 4s steps(1) infinite;}
/* 红/青染色用 filter */
.tl-r{filter:sepia(1) saturate(6) hue-rotate(-40deg);}
.tl-c{filter:sepia(1) saturate(6) hue-rotate(120deg);}
@keyframes glitchJitter{
  0%,89%,100%{transform:none;}
  91%{transform:translate(-3px,1px);}
  92%{transform:translate(2px,-2px);}
  93%{transform:translate(-2px,0);}
  94%{transform:none;}
  61%{transform:translate(2px,0);}
  62%{transform:none;}
}
@keyframes glitchR{
  0%,89%,100%{opacity:0;transform:none;clip-path:inset(0 0 0 0);}
  90%{opacity:.7;transform:translate(-6px,-2px);clip-path:inset(20% 0 40% 0);}
  92%{opacity:.7;transform:translate(4px,1px);clip-path:inset(60% 0 8% 0);}
  94%{opacity:0;transform:none;}
  60%{opacity:.6;transform:translate(-5px,0);clip-path:inset(40% 0 30% 0);}
  62%{opacity:0;}
}
@keyframes glitchC{
  0%,89%,100%{opacity:0;transform:none;clip-path:inset(0 0 0 0);}
  90%{opacity:.7;transform:translate(6px,2px);clip-path:inset(50% 0 20% 0);}
  92%{opacity:.7;transform:translate(-4px,-1px);clip-path:inset(8% 0 60% 0);}
  94%{opacity:0;transform:none;}
  60%{opacity:.6;transform:translate(5px,0);clip-path:inset(25% 0 50% 0);}
  62%{opacity:0;}
}
/* 偶尔整体扫描线撕裂 */
.tt-main::selection{background:#3affe0;}

.tt-sub{color:#fff;letter-spacing:.06em;margin-top:-.6em;
  font-family:"Noto Sans SC",sans-serif;font-size:clamp(1.7rem,3.6vw,2.6rem);
  font-weight:600;text-shadow:0 0 16px rgba(0,0,0,.9),0 0 30px rgba(234,244,255,.25);
  animation:subFlicker 5s steps(1) infinite;}
@keyframes subFlicker{
  0%,97%,100%{opacity:.85;}
  98%{opacity:.4;}
  99%{opacity:.85;}
}
/* ===== 手机端:关闭水波扰动(卡),标题更大,副标题更小 ===== */
@media(max-width:760px){
  #title-screen .tt-cover{filter:blur(1.5px)!important;}  /* 去掉 feDisplacementMap */
  .tt-logo{width:min(92vw,560px);}                        /* 标题放大 */
  .tt-sub{font-size:1.15rem;letter-spacing:.04em;margin-top:-.3em;}  /* 副标题小两号 */
}
#start-btn{margin-top:3.4em;position:relative;z-index:2;
  background:rgba(0,0,0,.3);border:1px solid var(--line);
  color:var(--ink);padding:15px 46px;letter-spacing:.34em;cursor:pointer;
  font-family:"Noto Sans SC",sans-serif;border-radius:2px;font-size:.9rem;
  transition:all .35s;backdrop-filter:blur(2px);}
#start-btn:hover{border-color:var(--warm-deep);color:var(--warm);
  box-shadow:0 0 30px rgba(232,201,143,.12)}

@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.2s!important}
}

<body>

<div id="stage">
  <div id="scene"></div>

  <!-- 全局 SVG 滤镜:水泡扰动 + 水波纹 -->
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <!-- 缓慢水泡流动(阶段1/2) -->
      <filter id="bubble">
        <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02"
          numOctaves="2" seed="7" result="n">
          <animate attributeName="baseFrequency"
            dur="14s" values="0.012 0.02;0.02 0.03;0.012 0.02"
            repeatCount="indefinite"/>
        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="n"
          scale="34" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <!-- 更细密的水波纹(阶段3 立绘切换) -->
      <filter id="ripple">
        <feTurbulence type="turbulence" baseFrequency="0.02 0.035"
          numOctaves="2" seed="3" result="n">
          <animate attributeName="baseFrequency"
            dur="7s" values="0.02 0.035;0.035 0.05;0.02 0.035"
            repeatCount="indefinite"/>
        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="n"
          scale="22" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <!-- 封面背景水面扰动:大范围缓慢荡漾 -->
      <filter id="waterSurface">
        <feTurbulence type="fractalNoise" baseFrequency="0.008 0.014"
          numOctaves="2" seed="5" result="n">
          <animate attributeName="baseFrequency"
            dur="12s" values="0.008 0.014;0.012 0.02;0.008 0.014"
            repeatCount="indefinite"/>
        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="n"
          scale="18" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>

  <!-- 剪影舞台:三阶段共用容器 -->
  <div id="silhouette"></div>

  <div id="choices"></div>

  <div id="textbox">
    <div id="speaker"></div>
    <div id="dialogue"></div>
    <div id="continue-hint">▾ 点击继续</div>
  </div>
</div>

<!-- 开场标题 -->
<div id="title-screen">
  <div class="tt-cover"></div>
  <div class="tt-breathe"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
  <div class="tt-ripples"></div>
  <div class="tt-stars"></div>
  <div class="tt-wrap">
    <div class="tt-logo">
      <img class="tl-main" src="assets/cover/echo.png" alt="泰拉·回响">
      <img class="tl-r" src="assets/cover/echo.png" alt="" aria-hidden="true">
      <img class="tl-c" src="assets/cover/echo.png" alt="" aria-hidden="true">
    </div>
    <div class="tt-sub">找出属于你的明日方舟命定之人</div>
    <button id="start-btn">开始寻找</button>
  </div>
</div>

<!-- 结局显影 -->
<div id="ending">
  <div class="skew-bg">
    <div class="skew-white">
      <div class="sw-deco">
        <div class="sw-marks"><span>01</span><span>02</span><span>03</span><span>04</span></div>
        <div class="sw-circuit"></div>
      </div>
    </div>
    <div class="skew-black">
      <div class="sb-meta">
        <div class="sb-data-no">DATA NO.<b id="op-data-no">#0000</b></div>
        <div class="sb-barcode" aria-hidden="true"></div>
      </div>
    </div>
    <svg class="skew-cut" viewBox="0 0 100 100" preserveAspectRatio="none">
      <path class="burn-far"  d="M 55 0 C 52 9, 49 13, 51 20 S 58 30, 55 38 C 53 45, 48 49, 50 57 S 57 68, 53 77 C 51 84, 55 90, 52 100"/>
      <path class="burn-mid"  d="M 55 0 C 52 9, 49 13, 51 20 S 58 30, 55 38 C 53 45, 48 49, 50 57 S 57 68, 53 77 C 51 84, 55 90, 52 100"/>
      <path class="burn-hot"  d="M 55 0 C 52 9, 49 13, 51 20 S 58 30, 55 38 C 53 45, 48 49, 50 57 S 57 68, 53 77 C 51 84, 55 90, 52 100"/>
      <path class="burn-edge" d="M 55 0 C 52 9, 49 13, 51 20 S 58 30, 55 38 C 53 45, 48 49, 50 57 S 57 68, 53 77 C 51 84, 55 90, 52 100"/>
    </svg>
  </div>
  <!-- 显影舞台:眼睑开合 → 睁眼白光绽开 → 彩色立绘 → 滑向右侧 -->
  <div class="reveal-stage">
    <img class="rv-sil" alt="">
    <img class="rv-back" alt="" aria-hidden="true">
    <img class="rv-real" alt="">
    <div class="rv-bloom"></div>
  </div>
  <svg class="eye-mask" viewBox="0 0 1440 860" preserveAspectRatio="xMidYMid slice">
    <defs>
      <mask id="eyeHole">
        <rect width="1440" height="860" fill="white"/>
        <path class="eye-shape" d="M 0 430 Q 720 120 1440 430 Q 720 740 0 430 Z" fill="black"/>
      </mask>
    </defs>
    <rect width="1440" height="860" fill="#000" mask="url(#eyeHole)"/>
  </svg>
  <div class="fx-flare">
    <div class="haze-wrap"></div>
    <div class="fx-flare-rect"></div>
    <div class="fx-flare-round"></div>
  </div>
  <div class="end-info">
    <div class="op-kicker">测试结束</div>
  </div>
  <!-- 右侧黑区:问句(白字)独立定位,身份卡在下方 -->
  <div class="op-ask">
    <span class="op-ask-l">你要找的人是</span>
    <div class="op-name"></div>
    <span class="op-ask-r">吗？</span>
  </div>
  <div class="end-right">
    <div class="id-card">
      <div class="id-mark" aria-hidden="true"></div>
      <div class="id-title">身份确认</div>
      <div class="id-row"><span>代号</span><b class="id-en"></b></div>
      <div class="id-row"><span>性别</span><b class="id-gender"></b></div>
      <div class="id-row"><span>势力</span><b class="id-faction"></b></div>
      <div class="id-row"><span>出身地</span><b class="id-origin"></b></div>
      <div class="id-row"><span>种族</span><b class="id-race"></b></div>
      <div class="id-row"><span>子职业</span><b class="id-class"></b></div>
      <button id="replay">再寻找一次</button>
    </div>
  </div>
  <div class="pull-bar" id="pull-bar">
    <span class="pb-side">系统日志</span>
    <div class="pb-mid">
      <i></i>
      <span>点击或上拉，查看重逢</span>
    </div>
    <span class="pb-side">机密</span>
  </div>
</div>
<!-- 重逢剧情覆盖层(点击/上拉后从下方升起,半透明盖住结算页) -->
<div id="reunion-scene">
  <div class="rs-bg"></div>
  <div class="rs-textbox">
    <div class="rs-speaker"></div>
    <div class="rs-dialogue"></div>
    <div class="rs-hint">▾ 点击继续</div>
  </div>
</div>

<!-- 普瑞塞斯 meta 层 -->
<div id="meta">
  <div class="meta-inner">
    <div class="meta-tag">// SYSTEM OVERRIDE</div>
    <div id="meta-lines"></div>
    <button id="replay-meta" style="margin-top:2em;background:none;
      border:1px solid #1e4a5a;color:#4fd4ff;padding:12px 30px;
      letter-spacing:.24em;font-family:inherit;cursor:pointer;border-radius:2px">
      重新开始观测</button>
  </div>
</div>

<!-- 普瑞塞斯跳脸层(叠在所有 UI 最前,层透明保留原界面) -->
<div id="priestess">
  <img class="pr-portrait" alt="">
  <div class="pr-glitch"></div>
  <div class="pr-scanlines"></div>
  <div class="pr-dialogue"></div>
  <div class="pr-confirm"></div>
</div>

<!-- 全局蓝色炫光背景层(CSS,替代 Blue_Gleam 视频) -->
<div id="global-flare" aria-hidden="true">
  <div class="gf-haze"></div>
  <div class="gf-beam gf-beam-a"></div>
  <div class="gf-beam gf-beam-b"></div>
  <div class="gf-orb gf-orb-a"></div>
  <div class="gf-orb gf-orb-b"></div>
</div>

<script src="data.js"></script>
<script src="ui.js"></script>
<script src="engine.js"></script>
<script>
  UI.initScene();

  // 标题页星尘:生成很多闪烁漂浮的亮点
  (function(){
    const box = document.querySelector(".tt-stars");
    if (box) {
      const N = 90;
      for (let i=0;i<N;i++){
        const s = document.createElement("div");
        s.className = "st";
        const size = Math.random()<0.8 ? (1+Math.random()*1.5) : (2+Math.random()*2.5);
        s.style.width = s.style.height = size+"px";
        s.style.left = Math.random()*100+"%";
        s.style.top = Math.random()*100+"%";
        s.style.animationDuration = (3+Math.random()*5)+"s";
        s.style.animationDelay = -(Math.random()*8)+"s";
        s.style.boxShadow = "0 0 "+(2+Math.random()*4)+"px rgba(255,255,255,.9)";
        box.appendChild(s);
      }
    }
  })();

  // 标题页水波涟漪:随机位置/大小,一圈圈荡开,不断刷新
  (function(){
    const box = document.querySelector(".tt-ripples");
    if (!box) return;
    function spawn(){
      const r = document.createElement("div");
      r.className = "ripple";
      // 最大直径 ~ 标题图宽度(min(60vw,720px)),有大有小
      const maxD = Math.min(window.innerWidth*0.6, 720);
      const d = maxD * (0.35 + Math.random()*0.65);
      r.style.width = r.style.height = d+"px";
      r.style.left = (10+Math.random()*80)+"%";
      r.style.top = (14+Math.random()*72)+"%";
      const dur = 4 + Math.random()*4;   // 荡开慢一点
      r.style.animationDuration = dur+"s";
      box.appendChild(r);
      setTimeout(()=>r.remove(), dur*1000+100);
    }
    // 初始铺几个,之后随机间隔不断刷新
    for(let i=0;i<3;i++) setTimeout(spawn, i*900);
    setInterval(()=>{ if(Math.random()<0.8) spawn(); }, 1300);
  })();

  document.getElementById("start-btn").addEventListener("click",()=>{
    document.getElementById("title-screen").classList.add("hide");
    setTimeout(()=>ENGINE.startGame(),700);
  });
  document.getElementById("replay").addEventListener("click",()=>location.reload());
  document.getElementById("replay-meta").addEventListener("click",()=>location.reload());
  document.getElementById("pull-bar").addEventListener("click",()=>UI.startReunion());
</script>
</body>
</html>
